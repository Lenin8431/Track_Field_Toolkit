name: track_field_toolkit
description: 田径通用工具 - 跑圈计时与中距离比赛配速模拟器
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 说明：应用运行时不依赖任何第三方插件，
  # 训练记录用 dart:io 写入应用私有目录，避免 Android 插件与 compileSdk 版本冲突。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
